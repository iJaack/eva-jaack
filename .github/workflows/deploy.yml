name: Validate Monorepo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  deployment_status:

concurrency:
  group: validate-monorepo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke script tests
        run: pnpm test:smoke

      - name: Sync ABI output
        run: pnpm sync:abi

      - name: Backend typecheck
        run: pnpm --filter backend typecheck

      - name: Backend build
        run: pnpm --filter backend build

      - name: Backend tests
        run: pnpm --filter backend test

      - name: Frontend typecheck
        run: pnpm --filter frontend typecheck

      - name: Frontend lint
        run: pnpm --filter frontend lint

      - name: Frontend build
        run: pnpm --filter frontend build

      - name: Install Playwright browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Frontend E2E
        run: pnpm --filter frontend test:e2e

      - name: Frontend responsive route audit
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:3001/api
          AUDIT_API_BASE: http://127.0.0.1:3001/api
          EVA_STORAGE_PROVIDER: local
          EVA_STORAGE_DIR: ${{ runner.temp }}/eva-storage
        run: |
          pnpm --filter backend dev > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          NEXT_PUBLIC_API_BASE="$NEXT_PUBLIC_API_BASE" pnpm --filter frontend exec next dev --webpack --hostname 127.0.0.1 --port 4281 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          frontend_pid=$!
          cleanup() {
            kill "$backend_pid" "$frontend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3001/health > /dev/null
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:4281/ > /dev/null
          node frontend/scripts/responsive-live-audit.mjs http://127.0.0.1:4281 "$RUNNER_TEMP/responsive-live-audit"

      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
            ${{ runner.temp }}/responsive-live-audit
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Contract tests
        run: cd contracts && forge test

  deployment-smoke:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve smoke base URL
        id: smoke-url
        env:
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          url="$ENVIRONMENT_URL"
          if [ -z "$url" ]; then
            url="$TARGET_URL"
          fi
          if [ -z "$url" ]; then
            echo "Missing deployment_status environment_url/target_url" >&2
            exit 1
          fi
          echo "base_url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke deployed surfaces
        env:
          SMOKE_BASE_URL: ${{ steps.smoke-url.outputs.base_url }}
          SMOKE_CURATORS_MAX_MS: '5000'
          SMOKE_ALLOW_PROTECTED_SKIP: 'true'
          SMOKE_REQUIRE_SELF_CUSTODY_WALLET: 'true'
          SMOKE_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm smoke:deploy

      - name: Install deployed-browser smoke browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Browser-smoke deployed authoring and proof routes
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.smoke-url.outputs.base_url }}
          SMOKE_ALLOW_PROTECTED_SKIP: 'true'
          SMOKE_VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter frontend exec playwright test e2e/deployment.spec.ts --project=desktop-chromium --project=mobile-chromium
